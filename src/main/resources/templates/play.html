<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Quiz</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    let selectedIndex = null;
    function subscribe() {
      const qSource = new EventSource('/api/stream/question');
      qSource.addEventListener('question', (e) => {
        const q = JSON.parse(e.data);
        renderQuestion(q);
        selectedIndex = null;
        renderOptions(q);
      });

      const lSource = new EventSource('/api/stream/leaderboard');
      lSource.addEventListener('leaderboard', (e) => {
        const lb = JSON.parse(e.data);
        renderLeaderboard(lb);
      });
    }

    function renderQuestion(q) {
      const el = document.getElementById('question');
      el.textContent = q ? q.text : 'Waiting for question...';
    }

    function renderOptions(q) {
      const container = document.getElementById('options');
      container.innerHTML = '';
      if (!q) return;
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-outline-primary option-btn';
        btn.textContent = opt;
        btn.onclick = () => submit(idx);
        container.appendChild(btn);
      });
    }

    async function submit(idx) {
      selectedIndex = idx;
      const form = new FormData();
      form.append('index', idx);
      await fetch('/api/answer', { method: 'POST', body: form });
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.option-btn')[idx].classList.add('active');
    }

    function renderLeaderboard(lb) {
      const tbody = document.getElementById('lb-body');
      tbody.innerHTML = '';
      const entries = Object.entries(lb);
      if (entries.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="3" class="text-center text-muted">No scores yet</td>';
        tbody.appendChild(tr);
        return;
      }
      let rank = 1;
      for (const [name, score] of entries) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${rank}</td><td>${name}</td><td>${score}</td>`;
        tbody.appendChild(tr);
        rank++;
      }
    }

    window.addEventListener('DOMContentLoaded', subscribe);
  </script>
  <style>
    .option-btn { margin: 0.25rem; }
    .option-btn.active { background: #0d6efd; color: white; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Quiz</a>
    <div class="d-flex">
      <a class="btn btn-outline-light me-2" href="/admin" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Admin</a>
      <a class="btn btn-outline-light" href="/logout">Logout</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  <div class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h4 id="question">Loading...</h4>
          <div id="options" class="mt-3"></div>
          <p class="text-muted mt-2">Question rotates every <span th:text="${rotationSeconds}"></span> seconds.</p>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header">Leaderboard</div>
        <div class="card-body p-0">
          <table class="table mb-0">
            <thead>
            <tr><th>#</th><th>Player</th><th>Score</th></tr>
            </thead>
            <tbody id="lb-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
