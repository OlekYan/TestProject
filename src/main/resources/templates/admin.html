<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Manage Questions</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/play">Quiz Admin</a>
    <div class="d-flex">
      <a class="btn btn-outline-light" href="/logout">Logout</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  <div class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header">Replace Questions</div>
        <div class="card-body">
          <p class="text-muted">Paste JSON array of questions. Example:</p>
<pre class="bg-light p-2 border rounded small">[
  {
    "id": "q1",
    "text": "Capital of France?",
    "options": ["Berlin", "Madrid", "Paris", "Rome"],
    "correctIndex": 2
  }
]</pre>
          <textarea id="json" class="form-control" rows="12" placeholder='[ { "id":"q1", "text":"...", "options":["A","B","C","D"], "correctIndex":0 } ]'></textarea>
          <button class="btn btn-primary mt-3" onclick="send()">Save</button>
          <div id="msg" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  async function send() {
    const msg = document.getElementById('msg');
    msg.textContent = '';
    try {
      const data = JSON.parse(document.getElementById('json').value);
      const res = await fetch('/api/admin/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      msg.innerHTML = '<div class="alert alert-success">Questions updated.</div>';
    } catch (e) {
      msg.innerHTML = '<div class="alert alert-danger">Error: ' + e.message + '</div>';
    }
  }
</script>
<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
